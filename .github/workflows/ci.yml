# The checks of every pull request, one job per check. mingo pr merge asks each of
# them to be green on the pull request's head.
name: ci

on:
  pull_request:
  # By hand, for a run on the base after Actions comes back from an outage.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run e2e

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gitleaks lists the pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the history of the pull request's commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Dependency audit
        # Fails on a known vulnerability of high or critical severity.
        run: npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A repository an organization owns needs gitleaks' free license key as this secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The log and the job summary carry the findings; no comment on the pull request.
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Semgrep, community rules
        # The pinned container, the community ruleset, no metrics; any finding fails.
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.180.0 semgrep scan --config p/default --error --metrics=off
